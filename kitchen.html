<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Dose | شاشة المطبخ</title>
<link rel="manifest" href="app-kitchen.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<meta name="theme-color" content="#064e3b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="مطبخ Daily Dose">
<script src="pwa.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#021f18;--panel:#032e24;--gold:#c9a45c;--green:#10b981;--red:#ef4444;--amber:#f59e0b;--text:#f7f1e7}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
button{font-family:inherit;cursor:pointer;border:none}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 24px;background:var(--panel);border-bottom:2px solid var(--gold);position:sticky;top:0;z-index:5}
header h1{color:var(--gold);font-size:1.4rem}
.hbtn{background:transparent;color:var(--text);border:1px solid rgba(247,241,231,.18);border-radius:20px;padding:6px 14px;font-weight:700}
.counts{display:flex;gap:10px}
.cnt{background:#021f18;border-radius:14px;padding:4px 14px;font-weight:800}
.board{display:grid;grid-template-columns:1fr 1fr;gap:20px;padding:20px}
@media(max-width:800px){.board{grid-template-columns:1fr}}
.col h2{margin-bottom:12px;font-size:1.15rem;padding-bottom:8px;border-bottom:2px solid rgba(247,241,231,.18)}
.col.new h2{color:var(--amber)}.col.cook h2{color:var(--green)}
.list{display:flex;flex-direction:column;gap:14px}
.card{background:var(--panel);border-radius:18px;padding:16px;border-top:6px solid var(--amber)}
.cook .card{border-top-color:var(--green)}
.card.late{border-top-color:var(--red);box-shadow:0 0 0 2px var(--red) inset}
.card-head{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:1.15rem;margin-bottom:10px}
.timer{font-size:.95rem;padding:2px 12px;border-radius:14px;background:#021f18}
.late .timer{background:var(--red);color:#fff}
.item{display:flex;gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px dashed rgba(247,241,231,.18);font-size:1.1rem}
.item b{background:var(--gold);color:#021f18;border-radius:10px;padding:0 10px;font-weight:800}
.note{display:block;color:var(--amber);font-weight:700;font-size:.95rem}
.act{width:100%;margin-top:12px;padding:12px;border-radius:14px;font-weight:800;font-size:1.05rem;color:#fff}
.act.start{background:var(--amber)}.act.done{background:var(--green)}
.empty{color:#6b7280;text-align:center;padding:30px}
#login{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.box{background:var(--panel);border:2px solid var(--gold);border-radius:20px;padding:28px;width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px;text-align:center}
.box input{padding:12px 16px;border-radius:25px;border:1px solid rgba(247,241,231,.18);background:var(--bg);color:#fff;font-family:inherit;direction:ltr}
.box .go{background:var(--gold);color:#021f18;padding:12px;border-radius:25px;font-weight:800}
#err{color:var(--red);font-size:.85rem;min-height:1.2em;word-break:break-word}
#ai-fab{position:fixed;bottom:20px;left:20px;width:56px;height:56px;border-radius:50%;background:var(--gold);font-size:1.6rem;z-index:20}
#ai-panel{position:fixed;bottom:88px;left:20px;width:min(360px,calc(100% - 40px));height:60vh;background:var(--panel);border:2px solid var(--gold);border-radius:18px;display:none;flex-direction:column;z-index:20;overflow:hidden}
#ai-panel.open{display:flex}
#ai-msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.m{max-width:85%;padding:8px 14px;border-radius:16px;white-space:pre-wrap;line-height:1.6}
.m.me{align-self:flex-start;background:#065f46}.m.bot{align-self:flex-end;background:rgba(247,241,231,.18)}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 12px 8px}
.chip{background:#021f18;color:var(--gold);border:1px solid var(--gold);border-radius:14px;padding:3px 10px;font-size:.8rem}
#ai-row{display:flex;gap:6px;padding:10px;border-top:1px solid rgba(247,241,231,.18)}
#ai-in{flex:1;padding:8px 12px;border-radius:18px;border:1px solid rgba(247,241,231,.18);background:var(--bg);color:#fff;font-family:inherit}
#ai-row button{background:var(--gold);color:#021f18;border-radius:18px;padding:0 16px;font-weight:800}
</style>
<meta name="robots" content="noindex">
</head>
<body>

<div id="login">
  <div class="box">
    <h2 style="color:var(--gold)">👨‍🍳 دخول المطبخ</h2>
    <input type="email" id="em" placeholder="البريد الإلكتروني" autocomplete="off">
    <input type="password" id="pw" placeholder="كلمة المرور" autocomplete="new-password" onkeydown="if(event.key==='Enter')doLogin()">
    <div id="err"></div>
    <button class="go" onclick="doLogin()">دخول</button>
  </div>
</div>

<header>
  <h1>👨‍🍳 مطبخ Daily Dose</h1>
  <div class="counts"><span class="cnt" id="c-new">جديد: 0</span><span class="cnt" id="c-cook">قيد التحضير: 0</span></div>
  <div style="display:flex;gap:8px">
    <button class="hbtn" id="snd" onclick="toggleSound()">🔔 الصوت</button>
    <button class="hbtn" onclick="doLogout()">🚪 خروج</button>
  </div>
</header>

<div class="board">
  <div class="col new"><h2>🆕 طلبات جديدة</h2><div class="list" id="l-new"></div></div>
  <div class="col cook"><h2>🔥 قيد التحضير</h2><div class="list" id="l-cook"></div></div>
</div>

<button id="ai-fab" onclick="document.getElementById('ai-panel').classList.toggle('open')">🤖</button>
<div id="ai-panel">
  <div id="ai-msgs"></div>
  <div class="chips">
    <button class="chip" onclick="ask('رتّب لي أولويات التحضير')">ترتيب الأولويات</button>
    <button class="chip" onclick="ask('في طلبات متأخرة؟')">المتأخرة</button>
    <button class="chip" onclick="ask('لخّص الكميات المطلوبة من كل صنف')">ملخص الكميات</button>
  </div>
  <div id="ai-row"><input id="ai-in" placeholder="اسأل المساعد..." onkeydown="if(event.key==='Enter')ask()"><button onclick="ask()">إرسال</button></div>
</div>

<script>
const SB_URL = 'https://zvwhiqjmydyyswwqmcwy.supabase.co';
const SB_KEY = 'sb_publishable_w0-bscTi4h8ExH_BQD_3Ig_tGUx7qUX';
const RID = 'eb399736-4a86-4109-86c5-798720f6d242';
const AI_URL = 'https://delicate-unit-5ea6.dailydosecafe.workers.dev';
const db = supabase.createClient(SB_URL, SB_KEY);
const beep = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');
let known = new Set(), first = true, soundOn = localStorage.getItem('ksound') !== 'off', hist = [];

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mins = iso => Math.max(0, Math.floor((Date.now() - new Date(iso)) / 60000));
const tLabel = t => (!t || t === 'زبون عام' || t === 'غير معروف') ? 'زبون عام' : 'طاولة ' + t;

async function start() {
  const { data } = await db.auth.getSession();
  document.getElementById('login').style.display = data.session ? 'none' : 'flex';
  document.getElementById('snd').textContent = soundOn ? '🔔 الصوت' : '🔕 الصوت';
  if (data.session) load();
}
async function doLogin() {
  const email = document.getElementById('em').value.replace(/\s/g, '').toLowerCase();
  const { error } = await db.auth.signInWithPassword({ email, password: document.getElementById('pw').value.trim() });
  document.getElementById('err').textContent = error ? 'خطأ: ' + error.message : '';
  if (!error) start();
}
async function doLogout() { await db.auth.signOut(); first = true; known.clear(); start(); }
function toggleSound() { soundOn = !soundOn; localStorage.setItem('ksound', soundOn ? 'on' : 'off'); start(); }

function card(o, cook) {
  const late = mins(o.created_at) >= 10;
  const items = (o.items || []).map(i => `<div class="item"><b>${esc(i.qty || 1)}×</b><span>${esc(i.name)}${i.note ? `<span class="note">⚠ ${esc(i.note)}</span>` : ''}</span></div>`).join('');
  return `<div class="card ${late ? 'late' : ''}">
    <div class="card-head"><span>${esc(tLabel(o.table_number))}</span><span class="timer">⏱ ${mins(o.created_at)} د</span></div>
    ${items}
    <button class="act ${cook ? 'done' : 'start'}" onclick="setStatus('${esc(o.id)}','${cook ? 'ready' : 'preparing'}')">${cook ? '✔️ الطلب جاهز' : '▶️ بدء التحضير'}</button>
  </div>`;
}
async function load() {
  const { data: s } = await db.auth.getSession(); if (!s.session) return;
  const { data, error } = await db.from('orders').select('*').eq('restaurant_id', RID).in('status', ['pending', 'preparing']).order('created_at', { ascending: true });
  if (error) { document.getElementById('l-new').innerHTML = `<div class="empty" style="direction:ltr">${esc(error.message)}</div>`; return; }
  const nw = data.filter(o => o.status === 'pending'), ck = data.filter(o => o.status === 'preparing');
  document.getElementById('l-new').innerHTML = nw.map(o => card(o, false)).join('') || '<div class="empty">لا توجد طلبات جديدة ☕</div>';
  document.getElementById('l-cook').innerHTML = ck.map(o => card(o, true)).join('') || '<div class="empty">لا شيء قيد التحضير</div>';
  document.getElementById('c-new').textContent = 'جديد: ' + nw.length;
  document.getElementById('c-cook').textContent = 'قيد التحضير: ' + ck.length;
  let fresh = false;
  nw.forEach(o => { if (!known.has(o.id)) { known.add(o.id); fresh = true; } });
  if (fresh && !first && soundOn) beep.play().catch(() => {});
  first = false;
}
async function setStatus(id, status) {
  const { error } = await db.from('orders').update({ status }).eq('id', id);
  if (error) alert('خطأ: ' + error.message);
  load();
}

/* المساعد الذكي للمطبخ */
function bubble(t, w) {
  const d = document.createElement('div'); d.className = 'm ' + w; d.textContent = t;
  const b = document.getElementById('ai-msgs'); b.appendChild(d); b.scrollTop = b.scrollHeight; return d;
}
async function ask(preset) {
  const inp = document.getElementById('ai-in');
  const q = (typeof preset === 'string' ? preset : inp.value).trim(); if (!q) return;
  inp.value = ''; bubble(q, 'me'); const w = bubble('...', 'bot');
  try {
    const { data } = await db.auth.getSession();
    const r = await fetch(AI_URL, { method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + (data.session?.access_token || '') },
      body: JSON.stringify({ question: q, role: 'kitchen', history: hist }) });
    const j = await r.json(); w.textContent = j.answer || 'حدث خطأ.';
    hist.push({ role: 'user', content: q }, { role: 'assistant', content: w.textContent }); hist = hist.slice(-8);
  } catch (e) { w.textContent = 'تعذر الاتصال بالمساعد.'; }
}

db.channel('kitchen_live').on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, load).subscribe();
setInterval(load, 5000);
start();
</script>
</body>
</html>
